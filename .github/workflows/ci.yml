name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.17 is the floor: vela (the only dependency) requires it, and so does
        # SvelteKit 3. There is no build step here, so `engines` is a claim this
        # matrix can actually check; 20 was dropped because vela cannot run there.
        node-version: ['22.17', 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # No devDependencies and no lockfile to install: the only dependency is
      # vela, and the smoke test pulls that in the way a user would.
      - name: Lint
        run: npx prettier@3.9.6 --check .

      - name: Smoke test
        run: npm run smoke

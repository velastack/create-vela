name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # By hand, from the default branch: releases the version the repository is at
  # and tags it. For when pushing a tag is not possible.
  workflow_dispatch:

permissions:
  contents: write # to push the tag when started by hand
  id-token: write # required for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11.x, required for OIDC trusted publishing (>= 11.5.1).
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # A pushed tag starts this run with the tag as its ref. Started by hand, the
      # tag is the version in package.json: it must not exist yet, and is pushed
      # at the end, once the package is published.
      - name: Resolve the release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "Run this from $DEFAULT_BRANCH, not $GITHUB_REF_NAME"
              exit 1
            fi
            TAG="v$(node -p "require('./package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "$TAG is already released: bump the version in package.json first"
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # `npm create vela` installs whatever this range resolves to. If it stops
      # reaching the current vela, every new project is scaffolded from stale
      # templates, so block the release rather than ship that quietly.
      - name: Verify the vela range reaches the current release
        run: |
          RANGE=$(node -p "require('./package.json').dependencies.vela")
          RESOLVED=$(npm view "vela@$RANGE" version --json \
            | node -e "let s='';process.stdin.on('data',(d)=>(s+=d)).on('end',()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v.at(-1):v)})")
          LATEST=$(npm view vela version)
          echo "\"$RANGE\" resolves to $RESOLVED; latest vela is $LATEST"
          if [ "$RESOLVED" != "$LATEST" ]; then
            echo "create-vela would install vela $RESOLVED — widen the range to reach $LATEST"
            exit 1
          fi

      - run: npx prettier@3.9.6 --check .
      - run: npm run smoke

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Push the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
